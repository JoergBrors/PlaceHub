name: Terraform

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Protected GitHub Environment configured by bootstrap
        required: true
        type: environment
      operation:
        description: Terraform operation
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.target_environment }}
    defaults:
      run:
        shell: bash
        working-directory: infrastructure/terraform
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      TF_VAR_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Check out the dispatched revision
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Azure with GitHub OIDC
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.1
          terraform_wrapper: false

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize remote state
        run: >-
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE }}"
          -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}"
          -backend-config="key=${{ vars.TF_STATE_KEY }}"

      - name: Validate
        run: terraform validate -no-color

      - name: Create saved plan
        run: terraform plan -no-color -lock-timeout=5m -out=tfplan

      - name: Show plan for review in this run
        run: terraform show -no-color tfplan

      - name: Apply the exact saved plan
        if: ${{ inputs.operation == 'apply' }}
        run: terraform apply -no-color -auto-approve -lock-timeout=5m tfplan

