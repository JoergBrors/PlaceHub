services:
  placehub-web:
    build: .
    ports: ["127.0.0.1:8080:8080"]
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 100
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      PlaceHub__IntegrationMode: OfflineMock
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/health/live"]
      interval: 30s
      timeout: 3s
      retries: 3
