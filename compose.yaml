services:
  placehub-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["127.0.0.1:3242:8443"]
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 100
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: https://+:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /run/placehub-tls/tls.crt
      ASPNETCORE_Kestrel__Certificates__Default__KeyPath: /run/placehub-tls/tls.key
      Microsoft365__Mode: Microsoft365ReadOnly
      Microsoft365__AllowSyntheticData: "false"
      Microsoft365__TenantId: ${PLACEHUB_TENANT_ID:-}
      Microsoft365__ClientId: ${PLACEHUB_CLIENT_ID:-}
      Microsoft365__Instance: https://login.microsoftonline.com/
      Microsoft365__CredentialProvider: Certificate
      Microsoft365__ClientCertificatePath: /run/placehub-tls/client-auth.pfx
      Microsoft365__ClientCertificates__0__SourceType: Path
      Microsoft365__ClientCertificates__0__CertificateDiskPath: /run/placehub-tls/client-auth.pfx
      PlaceHub__LocationAssignmentList: ${PLACEHUB_USER_OBJECT_ID:-UNASSIGNED}=${PLACEHUB_LOCATION_PLACE_ID:-UNASSIGNED}
    volumes:
      - type: bind
        source: ${PLACEHUB_TLS_DIRECTORY:?PLACEHUB_TLS_DIRECTORY required}
        target: /run/placehub-tls
        read_only: true
      - placehub-data:/var/lib/placehub
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--insecure", "--output", "/dev/null", "https://127.0.0.1:8443/health/live"]
      interval: 30s
      timeout: 3s
      retries: 3

  placehub-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    read_only: true
    tmpfs: ["/tmp:size=32m,noexec,nosuid"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    pids_limit: 80
    environment:
      Worker__Enabled: "false"
      Worker__KeyVaultNetworkPathVerified: "false"
      Worker__CredentialBootstrapVerified: "false"
      Worker__QueuePath: /var/lib/placehub/placehub-development.db
      Worker__Environment: development
    volumes:
      - placehub-data:/var/lib/placehub
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/placehub-worker-boundary-ready"]
      interval: 30s
      timeout: 3s
      retries: 3

volumes:
  placehub-data:
